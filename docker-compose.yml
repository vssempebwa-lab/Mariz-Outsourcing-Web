name: mariz-outsourcing-web

services:
  app:
    build:
      context: .
      secrets:
        - app_env
    container_name: mariz-outsourcing-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://marizgroup.com
    expose:
      - "3000"
    networks:
      - mariz_internal
      - elite_proxy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

networks:
  mariz_internal:
    internal: true
  elite_proxy:
    external: true
    name: elite-nursery-runtime_default

secrets:
  app_env:
    file: .env
